name: AI Bug Hunter

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get PR diff and call API
        id: prediction
        run: |
          git diff origin/${{ github.base_ref }}...HEAD | grep '^[+-]' | grep -v '^[+-][+-][+-]' | head -c 800 | tr -d '\n\"\`\r' > clean_diff.txt
          DIFF=$(cat clean_diff.txt)
          RESPONSE=$(curl -s -X POST "https://eo404--ai-bug-hunter-fastapi-app.modal.run/predict" -H "Content-Type: application/json" --data-binary "{\"diff_text\": \"${DIFF}\"}")
          echo "response<<EOF" >> $GITHUB_OUTPUT
          echo "${RESPONSE}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post comment on PR
        uses: actions/github-script@v6
        with:
          script: |
            const raw = `${{ steps.prediction.outputs.response }}`;
            const response = JSON.parse(raw);
            const emoji = response.prediction === 'BUGGY' ? '🔴' : '🟢';
            const tokens = response.top_buggy_tokens.map(t => t.token).join(', ');
            const body = emoji + ' **AI Bug Hunter**\n\n**Prediction:** ' + response.prediction + '\n**Confidence:** ' + response.confidence + '%\n**Risky tokens:** ' + tokens + '\n\n> Powered by CodeBERT + SHAP';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
