name: AI Bug Hunter

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  issues: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Wake up API
        run: |
          curl -s --max-time 60 "https://eo404--ai-bug-hunter-fastapi-app.modal.run/" || true
          sleep 5

      - name: Get PR diff and call API
        run: |
          git diff origin/${{ github.base_ref }}...HEAD | grep '^[+-]' | grep -v '^[+-][+-][+-]' | head -c 300 | tr -d '\n\r\"\`\\' > clean_diff.txt
          curl -s --max-time 120 -X POST "https://eo404--ai-bug-hunter-fastapi-app.modal.run/predict" \
            -H "Content-Type: application/json" \
            -d "{\"diff_text\": \"$(cat clean_diff.txt)\"}" \
            -o response.json
          cat response.json

      - name: Post comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('response.json', 'utf8');
            const response = JSON.parse(raw);
            const emoji = response.prediction === 'BUGGY' ? '🔴' : '🟢';
            const tokens = response.top_buggy_tokens.map(t => t.token).join(', ');
            const body = emoji + ' **AI Bug Hunter**\n\n**Prediction:** ' + response.prediction + '\n**Confidence:** ' + response.confidence + '%\n**Risky tokens:** ' + tokens + '\n\n> Powered by CodeBERT + SHAP';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
