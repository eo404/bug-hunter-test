name: AI Bug Hunter

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  issues: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install transformers torch huggingface_hub --quiet

      - name: Get diff and predict
        run: |
          git diff origin/${{ github.base_ref }}...HEAD | head -c 1000 > diff.txt
          python3 - <<'EOF'
import torch
import torch.nn.functional as F
from transformers import AutoTokenizer, AutoModelForSequenceClassification
import json

tokenizer = AutoTokenizer.from_pretrained("eldho15/ai-bug-hunter")
model = AutoModelForSequenceClassification.from_pretrained("eldho15/ai-bug-hunter")
model.eval()

with open("diff.txt") as f:
    diff = f.read()[:500]

inputs = tokenizer(diff, max_length=512, padding="max_length", truncation=True, return_tensors="pt")
with torch.no_grad():
    output = model(**inputs)
probs = F.softmax(output.logits, dim=1)
confidence = float(probs[0][1]) * 100
prediction = "BUGGY" if confidence > 50 else "CLEAN"

result = {"prediction": prediction, "confidence": round(confidence, 2)}
with open("response.json", "w") as f:
    json.dump(result, f)
print(json.dumps(result))
EOF

      - name: Post comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const response = JSON.parse(fs.readFileSync('response.json', 'utf8'));
            const emoji = response.prediction === 'BUGGY' ? '🔴' : '🟢';
            const body = emoji + ' **AI Bug Hunter**\n\n**Prediction:** ' + response.prediction + '\n**Confidence:** ' + response.confidence + '%\n\n> Powered by CodeBERT + SHAP';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
