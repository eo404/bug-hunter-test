name: AI Bug Hunter

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  issues: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install transformers torch huggingface_hub shap pandas requests --quiet

      - name: Get diff
        run: git diff origin/${{ github.base_ref }}...HEAD | head -c 1000 > diff.txt

      - name: Run prediction
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: python predict.py

      - name: Post comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const response = JSON.parse(fs.readFileSync('response.json', 'utf8'));
            const emoji = response.prediction === 'BUGGY' ? '🔴' : '🟢';
            const buggy = response.top_buggy_tokens.join(', ');
            const clean = response.top_clean_tokens.join(', ');
            const body = emoji + ' ## AI Bug Hunter Report\n\n' +
              '| | |\n|---|---|\n' +
              '| **Prediction** | ' + response.prediction + ' |\n' +
              '| **Confidence** | ' + response.confidence + '% |\n' +
              '| **Risky tokens** | `' + buggy + '` |\n' +
              '| **Safe tokens** | `' + clean + '` |\n\n' +
              '### 🧠 BugHunter AI Analysis\n\n' +
              response.fix_suggestion + '\n\n' +
              '---\n> Powered by CodeBERT + SHAP + BugHunter AI';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
