name: AI Bug Hunter

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > diff.txt
          DIFF=$(cat diff.txt | head -c 2000 | tr -d '\n\"\`')
          echo "diff=$DIFF" >> $GITHUB_OUTPUT

      - name: Call AI Bug Hunter API
        id: prediction
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://eo404--ai-bug-hunter-fastapi-app.modal.run/predict" \
            -H "Content-Type: application/json" \
            -d "{\"diff_text\": \"${{ steps.diff.outputs.diff }}\"}")
          echo "response=$RESPONSE" >> $GITHUB_OUTPUT

      - name: Post comment on PR
        uses: actions/github-script@v6
        with:
          script: |
            const response = JSON.parse('${{ steps.prediction.outputs.response }}');
            const prediction = response.prediction;
            const confidence = response.confidence;
            const buggyTokens = response.top_buggy_tokens.map(t => t.token).join(", ");
            const emoji = prediction === "BUGGY" ? "🔴" : "🟢";
            const body = `## ${emoji} AI Bug Hunter Report
            
**Prediction:** ${prediction}  
**Confidence:** ${confidence}%  
**Top risky tokens:** ${buggyTokens}  

> Powered by CodeBERT + SHAP`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
