name: AI Bug Hunter

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > diff.txt
          echo "diff=$(head -c 1000 diff.txt)" >> $GITHUB_OUTPUT

      - name: Call AI Bug Hunter API
        id: prediction
        run: |
          DIFF=$(head -c 500 diff.txt)
          RESPONSE=$(curl -s -X POST "https://eo404--ai-bug-hunter-fastapi-app.modal.run/predict" -H "Content-Type: application/json" -d "{\"diff_text\": \"${DIFF}\"}")
          echo "response=${RESPONSE}" >> $GITHUB_OUTPUT

      - name: Post comment on PR
        uses: actions/github-script@v6
        with:
          script: |
            const raw = `${{ steps.prediction.outputs.response }}`;
            const response = JSON.parse(raw);
            const emoji = response.prediction === "BUGGY" ? "🔴" : "🟢";
            const tokens = response.top_buggy_tokens.map(t => t.token).join(", ");
            const body = emoji + " **AI Bug Hunter**\n\n**Prediction:** " + response.prediction + "\n**Confidence:** " + response.confidence + "%\n**Risky tokens:** " + tokens + "\n\n> Powered by CodeBERT + SHAP";
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
